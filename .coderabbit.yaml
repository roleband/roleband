# A pull request from a branch of this repository is reviewed under its own
# copy of this file; one from a fork, under main's. The review is advisory: it
# is not a required check, and only a maintainer's request has to be met.
language: en-GB
tone_instructions: >-
  Be brief and plain. Comment only on defects and on breaks of the rules in
  AGENTS.md and the doc that owns the subject. Skip style the linters check.
  Never use em-dashes.

reviews:
  profile: chill
  # It summarises in its own comment, and leaves the author's description alone.
  high_level_summary: false
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  auto_apply_labels: false

  auto_review:
    enabled: true
    ignore_title_keywords:
      - "[skip review]"
    # A bump of a package dependabot.yml lists as not cleared by green CI is
    # reviewed on request with `@coderabbitai review`.
    ignore_usernames:
      - "dependabot[bot]"

  # Generated, locked or captured files: a change to one is reviewed through
  # what produces it.
  path_filters:
    - "!dashboard/package-lock.json"
    - "!backend/tracker/datasets.lock.json"
    - "!launcher/macos/runtime-lock.txt"
    - "!dashboard/openapi.json"
    - "!**/*.gen.ts"
    - "!**/*.gen.json"
    - "!backend/tracker/notifications/catalog_gen.py"
    - "!backend/tests/fixtures/listings/**"

  path_instructions:
    - path: "backend/**"
      instructions: >-
        Rules are in docs/development.md, docs/architecture.md and
        docs/testing.md. Flag a command or script that rewrites many rows
        without committing per batch and resuming. Flag a test that mocks the
        code under test, or that contacts a live job board, pay source or API.
        The backend sends codes and slugs, not English for a person to read
        (docs/copy.md section 5); a router raises api_error with an ErrorCode,
        never HTTPException.
    - path: "backend/alembic/versions/**"
      instructions: >-
        Observation history cannot be rebuilt once it is gone. In upgrade(),
        flag a step that drops a column or table holding user data, deletes or
        rewrites rows, or cannot run on a database already holding data.
        job_observations is append-only. A downgrade() that undoes its own
        upgrade() is expected.
    - path: "{backend/tracker/levels/atlas/**,backend/tracker/profiles/benefits_dataset/**}"
      instructions: >-
        A pinned, read-only copy of roleband/roleband-data, never edited by
        hand: it changes only through scripts.data pin, with
        backend/tracker/datasets.lock.json in the same commit
        (docs/development.md section 7). Do not review the rows; flag a hand
        edit, and point a data change to roleband-data.
    - path: "backend/{requirements*.txt,constraints/**}"
      instructions: >-
        The constraints files are generated by scripts/lock_dependencies.py.
        A change to selectolax, onnxruntime, tokenizers or pgvector can pass CI
        and still break extraction or embeddings: ask for the manual checks
        .github/dependabot.yml names for it. A constraints change also
        regenerates launcher/macos/runtime-lock.txt.
    - path: "{backend/tracker/**,dashboard/src/**,dashboard/csp-policy.json,launcher/**}"
      instructions: >-
        Flag a new request leaving the machine, or new data sent in one, that
        the table "What leaves your computer" in SECURITY.md does not list; the
        pull request updates it, and docs/usage-data.md for usage events. Flag a
        GET route that writes, and any widening of LoopbackBoundary or
        csp-policy.json.
    - path: "dashboard/**"
      instructions: >-
        Rules are in docs/ui.md and docs/copy.md. Text a person reads lives in
        the catalog under dashboard/src/copy/en/, never inline in a component.
    - path: "dashboard/src/copy/**"
      instructions: >-
        A translation's fingerprint in translated-from.json changes only for a
        message re-translated in this pull request (docs/copy.md). Flag a
        fingerprint refreshed for a message whose translation did not change.
        An entry in translation-quarantine.json holds a translation that
        breaks its contract; the repair removes it in the same change.
    - path: "{dashboard/src/test/*-baseline.json,backend/tests/fixtures/copy_glossary_baseline.json,backend/audit-exceptions.toml,dashboard/audit-exceptions.json,.gitleaks.toml,backend/pyproject.toml,dashboard/eslint.config.js}"
      instructions: >-
        These lists only shrink or are lowered: baselines, audit and secret-scan
        exceptions, ignore_imports in pyproject.toml and LEGACY_EDGES in
        eslint.config.js. Flag an entry added or a number raised.
    - path: "{dashboard/bundle-baseline.json,dashboard/copy-bundle-baseline.json,backend/tests/fixtures/route_table.json,backend/tests/fixtures/schema_metadata.json,backend/tests/fixtures/*eval_baseline*.json}"
      instructions: >-
        These are re-recorded only for a deliberate change, by the command
        docs/testing.md names. Flag a change the pull request description does
        not name and explain.
    - path: ".github/workflows/**"
      instructions: >-
        The repository is public and takes pull requests from forks. Flag
        pull_request_target, secrets or write permissions reachable from fork
        code, and permissions wider than the job needs.
        backend/tests/test_ci_workflow_triggers.py holds the trigger rules.
    - path: "launcher/**"
      instructions: >-
        Rules are in docs/architecture.md section The Mac app, docs/ui.md
        sections Native launcher updates and Launcher installation guide, and
        SECURITY.md for signing and update hosts. Ask which of the real-Mac
        checks in the docs/testing.md launcher row the author ran.
    - path: "**/*.md"
      instructions: >-
        A doc describes the system as it is now: no history, plan IDs, dates of
        decisions or counts from a live database. Each fact has one owning doc;
        elsewhere one line links it. docs/ is a closed set. A record in
        docs/decisions/ follows 0000-template.md and comes with the matching
        change to docs/architecture.md.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    custom_checks:
      - name: "Test that fails without the change"
        mode: warning
        instructions: >-
          Pass if the change adds or changes a test that would fail without it,
          or if the description says why no test can. Fail if a test is
          deleted, skipped, marked xfail or loosened, unless the description
          names the behaviour change that requires it. Changes to docs,
          dependencies, .github templates or repository metadata pass.
      - name: "Gate reported"
        mode: warning
        instructions: >-
          Pass if the description names the commands of the change-scoped gate
          in docs/testing.md that the author ran for what the change touches,
          or says which could not run and why.
      - name: "Data safety"
        mode: warning
        instructions: >-
          Fail if a migration, script or command drops, truncates, resets or
          bulk-deletes user data, or rewrites many rows without committing per
          batch. Ignore backend/tests/ and a downgrade() that undoes its own
          upgrade().
      - name: "Owning doc updated"
        mode: warning
        instructions: >-
          Fail if the change makes a statement untrue in the doc that owns the
          subject (the first table in docs/development.md) and does not update
          that doc.
      - name: "Not mergeable by rule"
        mode: warning
        instructions: >-
          Fail on a change to when a posting is closed without proof that the
          listing it relies on is complete (docs/architecture.md, Completeness
          and closure), or on core code that reads an outside pay,
          company-facts or benefits source; those are plugins
          (CONTRIBUTING.md, What we will not merge).

  # Each of these writes code or commits; tests and docstrings here are
  # written by a person to the bar in AGENTS.md and docs/testing.md.
  finishing_touches:
    unit_tests:
      enabled: false
    docstrings:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  # CI runs ruff and eslint with this project's rules; the others apply rules
  # the project does not hold, or repeat the dependency audit gates.
  tools:
    ruff:
      enabled: false
    eslint:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    swiftlint:
      enabled: false
    htmlhint:
      enabled: false
    reactDoctor:
      enabled: false
    osvScanner:
      enabled: false

# Anyone can comment on a public pull request; only members teach it learnings.
chat:
  allow_non_org_members: false
  art: false

issue_enrichment:
  planning:
    auto_planning:
      enabled: false

knowledge_base:
  code_guidelines:
    filePatterns:
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/testing.md"
      - "docs/copy.md"
      - files: "docs/ui.md"
        applyTo: "dashboard/src/**,launcher/**"
  learnings:
    scope: local
