# RoleBand 简体中文规则（copy-check）。AI 初稿，待审校。
# 描述 RoleBand 内部机制的词，不出现在界面上。
banned: [爬虫, 抓取器, 连接器, 适配器, 同步, 端点, 载荷, 向量, 嵌入]
retired: []
# 统一称呼：你。不使用“您”。
register:
  formal: false
  forbidden: [您]
proper_nouns: [RoleBand, AI, LinkedIn, macOS, Apple, Google, Stripe]
mechanics:
  # 所有者规则：不用破折号（—）。省略号用一个字符。
  forbid: ["—", "..."]
# 错误消息结尾的封闭列表（或消息注明 next=none）。
next_steps: ["请重试。", "扫描结束后请重试。", "结束后请重试。", "请确认 RoleBand 正在运行，然后重试。",
  "请确认它正在运行，然后重试。", "请检查链接后重试。", "请检查年份后重试。", "添加后请重试。", "修正后请重试。",
  "请在 设置 › AI 中开启。", "请在 设置 › 插件 中关闭。", "请在 设置 › AI 中添加一个。", "请在 已决定 中更改。", "请在你的 Tiingo 账户中核对后重试。"]

# Han vocabulary and address forms do not use whitespace word boundaries.
matching: substring

# A named skill; the ban concerns internal implementation jargon.
allowed:
  phrases: [向量数据库]
