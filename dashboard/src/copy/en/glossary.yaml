# The product language's RULES, as data. The reasons live in docs/copy.md;
# the words' forms live in terms.ftl. Read by `npm run copy:check`.

# Words for how RoleBand works. Inflections and hyphenated
# forms are caught too ("scraping", "re-sync").
banned: [scrape, scraper, connector, adapter, drift, lineage, inventory, catalog,
  persona, scope, sync, synchronization, epoch, facet, hydrate, endpoint, semantic,
  vector, embedding, payload, position, opening, pursuit]

# Synonyms the lexicon replaced, matched as phrases.
retired: ["work style", "role kind", "career stage", "position type", "role family",
  "job family", "best match", "tracked role", "job post", "new signals", "known jobs",
  "twin openings", "same opening", "fetch the latest", "default pack", "starter set",
  "recommended set", "default list", "featured companies",
  "matching model", "pay band", "published band", "disclosed band", "salary band",
  "stated pay", "total pay", "total package", "estimated pay", "est. pay", "pay floor"]

# Each term's Never list. Checked in the catalog; the
# literals not yet migrated are held to `banned` and `retired`.
terms:
  role: { never: [listing, opportunity, req, job opening] }
  posting: { never: [job post, job ad, requisition] }

# Where an internal word is the honest one.
allowed:
  files:
    - features/notifications/diagnostics/NotifDiagnostics.tsx
    - features/notifications/sync-progress/SyncStream.tsx
    - features/notifications/sync-progress/SyncContribution.tsx
    - api/lineage.ts
  phrases: ["Apple Intelligence", "Opportunity radar", "your opportunity radar", "requisition ID",
    "Vector Databases"]   # the brand line; a skill employers name (vocab.ftl)

proper_nouns: [RoleBand, Windows, Applications, Finder, AI, LinkedIn, macOS, Apple, Google, Stripe, English, Spanish, Chinese, Mac, Radar]

mechanics:
  # No em-dash, anywhere. An ellipsis is one character.
  forbid: ["—", "..."]
  # One error grammar: contractions, never their long forms.
  contractions: { "Could not": "Couldn't", "Do not": "Don't", "Does not": "Doesn't" }

kinds:
  label:        { case: sentence, max_words: 4, full_stop: never }
  button:       { case: sentence, max_words: 3, full_stop: never }
  link:         { full_stop: never }      # an action written as a link in running text: "Show 12 other matches"
  heading:      { case: sentence, full_stop: never }
  sentence:     { full_stop: always }
  empty:        { full_stop: always }
  error:        { full_stop: always, next_step: required }
  toast:        { full_stop: optional }
  tooltip:      { full_stop: optional }
  aria:         { full_stop: never }
  notification: { full_stop: optional }
  consent:      { full_stop: always }
  status:       { full_stop: optional }   # a live readout: "3 queued · waiting until 14:05"
  name:         { full_stop: never }      # a proper name from the taxonomy: no case rule, no word limit

# The closed list an error may end with (or the message says next=none).
next_steps: ["Try again.", "Try again when the scan ends.", "Try again when it ends.",
  "Check that RoleBand is running, then try again.", "Check that it is running, then try again.",
  "Check the link and try again.", "Check the years and try again.", "Add it and try again.",
  "Fix them and try again.", "Turn it on in Settings › AI.", "Add one in Settings › AI.",
  "Turn it off in Settings › Plugins.",
  "Open your Radar from the app.",
  "Change it under Decided.", "Check it in your Tiingo account and try again.",
  "Mark it Withdrawn instead.",
  "Select the text and copy it yourself."]
