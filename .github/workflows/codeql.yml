name: codeql

# Code scanning with the default query suite. No `paths:` filter: the workflow-level
# filter would stop the Linux scans as well, and they read the whole tree. The Windows
# app's C# reads without a build there, so it needs no Windows runner. The
# Swift scan holds a macOS runner for as long as the launcher takes to compile, so its
# `changes` job runs it only when the Swift package it compiles, the decision script or
# this file changed; a weekly or manual run, or a diff that cannot be read, scans it anyway.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Tuesday 05:17 UTC: a fresh query pack over code no change touched.
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, csharp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  changes:
    name: codeql-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.decide.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TIER: swift
          SKIP_EVENTS: pull_request push
          PATHS: |
            launcher/macos/Package.swift
            launcher/macos/Package.resolved
            launcher/macos/Sources/**
            launcher/macos/Tools/ci_changes.py
            .github/workflows/codeql.yml
        run: python3 launcher/macos/Tools/ci_changes.py

  # The traced build is the launcher product as build-app.sh compiles it, with the
  # toolchain mac-launcher.yml pins: the code that ships, without its tests.
  swift:
    name: analyze (swift)
    needs: changes
    # Runs when `changes` fails too, and then scans.
    if: ${{ !cancelled() && needs.changes.outputs.swift != 'false' }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: |
          swift --version
          xcodebuild -version
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
      - name: Build the launcher product
        run: swift build --package-path launcher/macos --configuration release --product RoleBandLauncher
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
