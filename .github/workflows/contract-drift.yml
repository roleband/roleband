name: contract-drift

# dashboard/src/api.gen.ts is a purely derived mirror of the FastAPI schema
# (docs/architecture.md). Regenerate and fail on any diff.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read the code, nothing more: no job here writes to the repository.
permissions:
  contents: read

jobs:
  # A gate takes no `paths:` filter, so this job decides whether a pull request can change
  # the schema at all. PATHS is every file `regenerate` reads: the exporter and the `tracker`
  # package it imports, what that package names outside backend/, the locks and the two
  # generated files.
  changes:
    name: contract-drift-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      contract: ${{ steps.decide.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TIER: contract
          PATHS: |
            backend/tracker/**
            backend/scripts/__init__.py
            backend/scripts/export_openapi.py
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints/linux-x86_64.txt
            robots/python/**
            sdk/python/**
            dashboard/package.json
            dashboard/package-lock.json
            dashboard/openapi.json
            dashboard/src/api.gen.ts
            dashboard/csp-policy.json
            dashboard/src/companies.json
            CHANGELOG.md
            .python-version
            .nvmrc
            launcher/macos/Tools/ci_changes.py
            .github/workflows/contract-drift.yml
        run: python3 launcher/macos/Tools/ci_changes.py

  regenerate:
    name: contract-drift (regenerate)
    needs: changes
    # Runs when `changes` fails too.
    if: ${{ !cancelled() && needs.changes.outputs.contract != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints/linux-x86_64.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # .nvmrc (24). 24 not 22: npm 10 (bundled with node 22) and npm 11
          # (local dev, and what Dependabot writes locks with) disagree about
          # nested optional deps, so a lock written by one is rejected by the
          # other.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # FastAPI and Pydantic shape the schema, so the exporter runs on the locked graph.
      - run: pip install -r requirements.txt -r requirements-dev.txt -c constraints/linux-x86_64.txt
        working-directory: backend
      # The API imports the robots matcher, which is its own distribution.
      - run: pip install -e ../robots/python
        working-directory: backend
      - run: python -m scripts.export_openapi
        working-directory: backend
      - run: npm ci
        working-directory: dashboard
      - run: npm run gen:api
        working-directory: dashboard
      - name: fail on drift
        # Both artifacts, because they catch different things. api.gen.ts is a
        # lossy projection: most routes still return an unmodelled dict
        # (backend/tests/fixtures/route_table.json has the live count), so a
        # changed response shape can leave it byte-identical. openapi.json is
        # what the server declares.
        run: git diff --exit-code dashboard/src/api.gen.ts dashboard/openapi.json

  # The check the ruleset requires. `always()`: a skipped job counts as passed for a
  # required check, so this job runs and fails when the run is cancelled. `regenerate` may
  # be skipped only when the change cannot touch the schema. The step is windows.yml's.
  result:
    name: regen-diff
    needs: [changes, regenerate]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: python
        env:
          RESULT_regenerate: ${{ needs.regenerate.result }}
          NEEDED_regenerate: ${{ needs.changes.outputs.contract }}
        run: |
          import os
          results = {k.removeprefix("RESULT_"): v for k, v in os.environ.items() if k.startswith("RESULT_")}
          # A part may be skipped only when the change did not need it: NEEDED_<part> is 'false'.
          passed = {p: r == "success" or (r == "skipped" and os.environ.get(f"NEEDED_{p}") == "false") for p, r in results.items()}
          for part, result in sorted(results.items()):
              print(f"{part}: {result}")
          if not results or not all(passed.values()):
              raise SystemExit("not passed: " + (", ".join(sorted(p for p, ok in passed.items() if not ok)) or "no part reported"))
