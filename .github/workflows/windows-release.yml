name: windows-release

# Builds the Windows app from a published release's tag, signs it with RoleBand's own certificate and attaches the
# Windows files to that release, which both apps share (docs/decisions/0012-windows-distribution-and-signing.md).
# The build holds no secret. Signing runs only in the protected windows-release environment, which holds the
# certificate and the Windows release key; the spare key is never here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The published release to attach the Windows files to, such as v0.1.3
        required: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: build the unsigned package
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      identity: ${{ steps.source.outputs.identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      # A release from a commit without the Windows identity gets no Windows files, and the run succeeds.
      - id: source
        name: the tag names this version and carries the Windows identity
        run: |
          $identity = @(@('launcher/windows/release-identity.json', 'launcher/windows/RoleBand.cer') | Where-Object { Test-Path -LiteralPath $_ })
          if ($identity.Count -eq 0) {
            "::notice::$env:TAG carries no Windows release identity, so it gets no Windows files"
            "identity=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($identity.Count -ne 2) { throw "$env:TAG carries only $identity of the Windows release identity" }
          $version = (Get-Content -Raw dashboard/package.json | ConvertFrom-Json).version
          if ($env:TAG -cne "v$version") { throw "The tag $env:TAG does not name version $version" }
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "identity=true" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.source.outputs.identity == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.source.outputs.identity == 'true'
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.source.outputs.identity == 'true'
        with:
          dotnet-version: 10.0.x
      - name: dashboard packages
        if: steps.source.outputs.identity == 'true'
        working-directory: dashboard
        run: npm ci
      - name: tools
        if: steps.source.outputs.identity == 'true'
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r launcher/windows/signing-requirements.txt
      - name: assemble and package
        if: steps.source.outputs.identity == 'true'
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'bundle'
          python launcher/windows/Tools/assemble.py --channel release --destination $bundle --cache (Join-Path $env:RUNNER_TEMP 'cache')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'unsigned') | Out-Null
          ./launcher/windows/Package.ps1 -Bundle $bundle -Destination (Join-Path $env:RUNNER_TEMP 'unsigned/RoleBand.msix')
      # Setup carries this version, the committed identity and certificate, so it installs only this release's package.
      - name: Setup
        if: steps.source.outputs.identity == 'true'
        run: |
          $version = (Get-Content -Raw dashboard/package.json | ConvertFrom-Json).version
          dotnet restore launcher/windows/RoleBand.Setup --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish launcher/windows/RoleBand.Setup --no-restore -c Release -o (Join-Path $env:RUNNER_TEMP 'setup') "-p:RoleBandVersion=$version"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'setup/RoleBand-Setup.exe') (Join-Path $env:RUNNER_TEMP 'unsigned/RoleBand-Setup.exe')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.source.outputs.identity == 'true'
        with:
          name: windows-unsigned
          path: |
            ${{ runner.temp }}/unsigned/RoleBand.msix
            ${{ runner.temp }}/unsigned/RoleBand-Setup.exe
          if-no-files-found: error
          # Long enough for the signing job, which can wait days to start.
          retention-days: 14

  sign:
    name: sign and attach
    needs: build
    # A run by hand uses the workflow file of the branch it is started from, so only main's may sign.
    if: needs.build.outputs.identity == 'true' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: windows-2025
    timeout-minutes: 30
    environment: windows-release
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r launcher/windows/signing-requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: the release is published, from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft,tagName | ConvertFrom-Json
          if ($release.tagName -cne $env:TAG -or $release.isDraft) { throw 'Windows files attach only to a published release' }
          $tagged = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:TAG" --jq .sha
          if ($tagged -cne $env:COMMIT) { throw 'The tag moved after the build' }
      - name: sign
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          RELEASE_KEY: ${{ secrets.WINDOWS_RELEASE_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.WINDOWS_SIGNING_PASSPHRASE }}
        run: |
          $secret = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory $secret | Out-Null
          try {
            [IO.File]::WriteAllBytes((Join-Path $secret 'RoleBand-signing.pfx'), [Convert]::FromBase64String($env:SIGNING_PFX))
            [IO.File]::WriteAllText((Join-Path $secret 'release-key.pem'), $env:RELEASE_KEY)
            python launcher/windows/Tools/identity.py check --signing $secret --identity launcher/windows/release-identity.json `
              --certificate launcher/windows/RoleBand.cer --passphrase-env SIGNING_PASSPHRASE
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin/10.0.26100.0/x64'
            $package = Join-Path $env:RUNNER_TEMP 'unsigned/RoleBand.msix'
            $setup = Join-Path $env:RUNNER_TEMP 'unsigned/RoleBand-Setup.exe'
            $trusted = [IO.File]::ReadAllBytes((Resolve-Path launcher/windows/RoleBand.cer).Path)
            $publisher = (Get-Content -Raw launcher/windows/release-identity.json | ConvertFrom-Json).publisher
            foreach ($file in @($package, $setup)) {
              # Not timestamped: that would need an outside time server; the certificate lasts 25 years instead.
              & (Join-Path $kits 'signtool.exe') sign /fd SHA256 /f (Join-Path $secret 'RoleBand-signing.pfx') /p $env:SIGNING_PASSPHRASE $file
              if ($LASTEXITCODE) { throw "Signing $file failed" }
              $signer = (Get-AuthenticodeSignature $file).SignerCertificate
              if ($null -eq $signer -or [Convert]::ToBase64String($signer.RawData) -cne [Convert]::ToBase64String($trusted)) {
                throw "$file is not signed with the committed RoleBand.cer"
              }
              if ($signer.Subject -cne $publisher) { throw "$file is signed by '$($signer.Subject)', not '$publisher'" }
            }
            python launcher/windows/Tools/release.py prepare --package $package --destination (Join-Path $env:RUNNER_TEMP 'release') `
              --identity launcher/windows/release-identity.json --key (Join-Path $secret 'release-key.pem') `
              --commit $env:COMMIT --passphrase-env SIGNING_PASSPHRASE
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $secret -Recurse -Force -ErrorAction SilentlyContinue
          }
          python launcher/windows/Tools/release.py verify --directory (Join-Path $env:RUNNER_TEMP 'release') `
            --identity launcher/windows/release-identity.json --installed 0.0.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "RoleBand-Setup-$($env:TAG.Substring(1)).exe"
          Copy-Item (Join-Path $env:RUNNER_TEMP 'unsigned/RoleBand-Setup.exe') $setup
          $files = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'release') -File | ForEach-Object FullName) + $setup + (Resolve-Path launcher/windows/RoleBand.cer).Path
          # Without --clobber, a rerun cannot replace a file already attached.
          gh release upload $env:TAG --repo $env:GITHUB_REPOSITORY @files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
