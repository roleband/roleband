name: hygiene

# Whole-tree rules that no single area owns. No `paths:` filter on purpose: the
# old project name or a polluted comment can come back through any file, and a
# dashboard-only change must not skip the check. The two Python checks use the
# standard library only, so nothing is installed, and they run inside pytest
# too. actionlint runs from its image, which carries the shellcheck it uses.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-name:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: python backend/scripts/check_project_name.py

  comment-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: python backend/scripts/check_comment_hygiene.py

  # Workflow syntax, expressions and the shell in `run:` steps, so a workflow
  # mistake fails the pull request that makes it instead of a run on main.
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

  # The check the ruleset requires, standing for the three above. `always()`: a skipped job
  # counts as passed for a required check, so this job runs and fails when the run is
  # cancelled. The step is windows.yml's.
  result:
    name: hygiene
    needs: [project-name, comment-hygiene, actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: python
        env:
          RESULT_project_name: ${{ needs.project-name.result }}
          RESULT_comment_hygiene: ${{ needs.comment-hygiene.result }}
          RESULT_actionlint: ${{ needs.actionlint.result }}
        run: |
          import os
          results = {k.removeprefix("RESULT_"): v for k, v in os.environ.items() if k.startswith("RESULT_")}
          # A part may be skipped only when the change did not need it: NEEDED_<part> is 'false'.
          passed = {p: r == "success" or (r == "skipped" and os.environ.get(f"NEEDED_{p}") == "false") for p, r in results.items()}
          for part, result in sorted(results.items()):
              print(f"{part}: {result}")
          if not results or not all(passed.values()):
              raise SystemExit("not passed: " + (", ".join(sorted(p for p, ok in passed.items() if not ok)) or "no part reported"))
