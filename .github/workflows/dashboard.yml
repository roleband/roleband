name: dashboard

# The Playwright suite runs here. The specs are where nearly every user-visible
# claim lives (focus restoration, scroll lock, sticky bands, painted recession,
# the rail<->sheet switch); left local and opt-in, any UX-only regression could
# land green.
#
# BOTH projects, not chromium-only. The mobile project is an iPhone 14: a
# change verified only on wide screens can ship a mobile regression (bottom-nav
# label collisions, undersized tap targets at 375px), and running chromium
# alone would never see it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read the code, nothing more: no job here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A gate takes no `paths:` filter, so this job decides whether a pull request needs the
  # dashboard jobs at all. PATHS is every file they read.
  changes:
    name: dashboard-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dashboard: ${{ steps.decide.outputs.dashboard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TIER: dashboard
          PATHS: |
            dashboard/**
            backend/tracker/**
            backend/tests/fixtures/level_basis_gate.json
            backend/tests/fixtures/notification_keys.json
            launcher/contracts/status-cases.json
            launcher/macos/Sources/LauncherCore/Resources/**
            launcher/macos/Tools/ci_changes.py
            .nvmrc
            .github/workflows/dashboard.yml
        run: python3 launcher/macos/Tools/ci_changes.py

  checks:
    name: dashboard
    needs: changes
    # Runs when `changes` fails too.
    if: ${{ !cancelled() && needs.changes.outputs.dashboard != 'false' }}
    runs-on: ubuntu-latest
    # A hung step otherwise burns the 6-hour default, and these are billed
    # minutes on a private repo. The Playwright suite is its own job below, so
    # this cap only has to cover install, audit, lint, build and Vitest.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # .nvmrc (24), the file setup.sh reads too. 24 not 22: npm 10 (bundled
          # with node 22) and npm 11 (local dev, and what Dependabot writes locks
          # with) disagree about nested optional deps, so a lock written by one
          # is rejected by the other.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # High and critical advisories in what the built app ships; an accepted
      # one needs a current entry in audit-exceptions.json.
      - name: dependency audit
        run: npm run audit:check
      - name: eslint (layer rules)
        run: npm run lint
      # Unused files, packages and exports (knip.jsonc).
      - name: dead code
        run: npm run knip
      - name: build + typecheck
        run: npm run build
      - name: vitest
        run: npm run test:unit -- --reporter=default --reporter=json --outputFile=test-results/vitest.json
      - name: upload unit test timings and outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-unit-results
          path: dashboard/test-results/vitest.json
          if-no-files-found: ignore
          retention-days: 7

  # The suite split across four runners, two workers each (playwright.config.ts).
  # ROLEBAND_UX_SHARD hands each shard whole spec files of about equal recorded
  # time (tests/ux/shards.ts, weighed by tests/ux/shard-weights.json), and both
  # projects run that shard's files. Playwright's `--shard` cuts equal test counts
  # in file order instead, which leaves the heavy specs that sort late to the last
  # shard. Each shard serves its own build: the cost of sharding is that build and
  # the image pull, paid once per shard.
  #
  # Each shard runs in Microsoft's Playwright image for the locked version, the
  # one `deploy/check_local.py` runs locally: browsers and the Linux libraries
  # they launch with are already in it. The libraries cannot be cached, and
  # installing them from the Ubuntu mirror on every shard can stall and fail a
  # shard before any test runs.
  #
  # Every shard starts and skips its steps when the change does not need them: a matrix job
  # skipped whole reports one check, `ux`, and the required `ux (1)` to `ux (4)` would wait
  # forever.
  ux:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # About three times what a shard needs, so a slow runner still finishes and
    # a stall is still cut short. Below the job cap, the Playwright step has its
    # own, so a stalled run still uploads its traces.
    timeout-minutes: 30
    container:
      # The tag names the locked @playwright/test version and the digest pins
      # what it pointed to; a Playwright upgrade moves both in the same change
      # (backend/tests/test_ci_workflow_triggers.py holds the tag to the lock).
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      # Chromium keeps shared memory in /dev/shm, which Docker sizes at 64MB.
      options: --shm-size=2g
    strategy:
      # Every shard reports: one red shard must not hide another's failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEEDED: ${{ needs.changes.outputs.dashboard != 'false' }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.NEEDED == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.NEEDED == 'true'
        with:
          # .nvmrc (24), the file setup.sh reads too. 24 not 22: npm 10 (bundled
          # with node 22) and npm 11 (local dev, and what Dependabot writes locks
          # with) disagree about nested optional deps, so a lock written by one
          # is rejected by the other.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        if: env.NEEDED == 'true'
      # A fresh runner's first page in a browser can take tens of seconds, and
      # a test that opened it would pay that inside its own timeout.
      - name: warm the browsers
        if: env.NEEDED == 'true'
        timeout-minutes: 3
        run: node scripts/warm-browsers.mjs
      # The second run serves the build the first one made. It runs whatever the
      # first one did: a red chromium shard must not hide the mobile one.
      - name: playwright chromium, shard ${{ matrix.shard }} of 4
        if: env.NEEDED == 'true'
        timeout-minutes: 12
        env:
          ROLEBAND_UX_SHARD: ${{ matrix.shard }}/4
          ROLEBAND_UX_OUTPUT_DIR: test-results/chromium
        run: npm run test:ux -- --project=chromium
      - name: playwright mobile, shard ${{ matrix.shard }} of 4
        if: ${{ !cancelled() && env.NEEDED == 'true' }}
        timeout-minutes: 12
        env:
          ROLEBAND_UX_SHARD: ${{ matrix.shard }}/4
          ROLEBAND_UX_MODE: preview
          ROLEBAND_UX_OUTPUT_DIR: test-results/mobile
        run: npm run test:ux -- --project=mobile
      # The JSON reports are what tests/ux/shard-weights.json is refreshed from;
      # failures also retain traces.
      - name: upload browser timings and outcomes
        if: always() && env.NEEDED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.shard }}
          path: dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 7
