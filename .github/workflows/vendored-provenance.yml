name: vendored-provenance

# Has upstream moved under our vendored snapshots?
#
# RoleBand installs no scraper engine, so the only upstream code here is a
# vendored snapshot that deliberately never auto-follows upstream. That
# policy is right and it creates one blind spot: a stale snapshot is
# indistinguishable from a current one, so upstream fixes silently never arrive.
# This job is the notice, not an updater - it never edits code and no dependency
# bot can see vendored source. Two more steps ask the same of the binaries every
# install runs: whether python.org has a newer release of the apps' bundled Python,
# and whether postgresql.org or pgvector has a newer release of the embedded
# Postgres than the `pixeltable-pgserver` wheel ships.
#
# NON-BLOCKING by construction. It runs on a schedule and on demand, never on
# push or pull_request, so a GitHub outage or an API rate limit can never fail
# somebody's PR. A failure here means "read this", not "the build is broken".
#
# CAVEAT worth knowing: `schedule` only fires on the default branch of the
# GitHub remote. A checkout whose commits sit unpushed is not covered, so treat
# this as a backstop and run the scripts by hand monthly, from `backend/`:
#
#     .venv/bin/python -m scripts.check_vendored_upstream
#     .venv/bin/python -m scripts.check_runtime_python
#     .venv/bin/python -m scripts.check_embedded_postgres

on:
  schedule:
    # 07:00 UTC on the 1st: the monthly review cadence.
    - cron: "0 7 1 * *"
  workflow_dispatch:
  push:
    # Only when the pins themselves change, so a bad record is caught at the
    # commit that wrote it rather than up to a month later.
    branches: [main]
    paths:
      - "backend/tracker/vendored.py"
      - "backend/scripts/check_vendored_upstream.py"
      - "backend/scripts/check_runtime_python.py"
      - "backend/scripts/__init__.py"
      - "backend/scripts/check_embedded_postgres.py"
      - "backend/scripts/upstream_http.py"
      - "backend/tracker/platform/pgcontrib/manifest.json"
      - "backend/requirements.txt"
      - "backend/constraints/*.txt"
      - "launcher/macos/runtime-lock.txt"
      - "launcher/windows/runtime-lock.txt"
      - "launcher/macos/runtime.json"
      - "launcher/windows/runtime.json"
      - ".python-version"
      - ".github/workflows/vendored-provenance.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # A fetch that keeps failing takes about two minutes over its three tries, and
    # the Postgres step makes up to four, so a slow upstream ends in UNKNOWN, not a timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # httpx alone: the checker fetches and hashes blobs and needs none of the
      # DB/ML stack, so this stays a ~5s job rather than a full install.
      - run: pip install "httpx[http2]==0.28.1"
      - name: check vendored upstream
        working-directory: backend
        env:
          # Lifts the 60/hour unauthenticated GitHub API limit. Read-only.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m scripts.check_vendored_upstream | tee report.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Vendored upstream provenance"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case $code in
            0) echo "::notice::vendored snapshots are current" ;;
            1) echo "::warning::upstream changed a vendored file - diff it and decide" ;;
            2) echo "::error::a recorded provenance hash no longer matches its own ref" ;;
            3) echo "::notice::could not reach upstream; no verdict about the code" ;;
          esac
          # A broken PIN is our own record being wrong and is worth failing on.
          # DRIFT and UNKNOWN are information, and this job must not become a
          # red X people learn to ignore.
          [ "$code" = "2" ] && exit 1
          exit 0
      - name: check the bundled Python
        working-directory: backend
        run: |
          set +e
          python -m scripts.check_runtime_python | tee runtime.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Bundled Python"
            echo
            echo '```'
            cat runtime.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case $code in
            0) echo "::notice::the bundled Python is the newest release of its series" ;;
            1) echo "::warning::a newer Python security release is out - move the runtime pins" ;;
            3) echo "::notice::could not read python.org; no verdict about the pins" ;;
            2) echo "::error::a runtime pin names another build than its archives"; exit 1 ;;
            *) echo "::error::the bundled Python check failed"; exit 1 ;;
          esac
          exit 0
      - name: check the embedded Postgres
        working-directory: backend
        env:
          # Lifts the 60/hour unauthenticated GitHub API limit for pgvector's tags. Read-only.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m scripts.check_embedded_postgres | tee postgres.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Embedded Postgres"
            echo
            echo '```'
            cat postgres.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case $code in
            0) echo "::notice::the embedded Postgres and pgvector are the newest releases of their series" ;;
            1) echo "::warning::the embedded Postgres or pgvector is behind - read the report in the job summary" ;;
            3) echo "::notice::could not read an upstream release list; no verdict about the pins" ;;
            2) echo "::error::the pg_trgm manifest disagrees with the wheel pins"; exit 1 ;;
            *) echo "::error::the embedded Postgres check failed"; exit 1 ;;
          esac
          exit 0
