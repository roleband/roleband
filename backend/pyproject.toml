# Listing modules and detail modules stay mutually import-free. The one
# exemption: apple's listing hydrate calls detail's structure_job_detail.
[[tool.importlinter.contracts]]
name = "Listing and detail connectors are independent"
type = "independence"
modules = [
    "tracker.connectors.listing",
    "tracker.connectors.detail",
]
ignore_imports = [
    "tracker.connectors.listing.apple -> tracker.connectors.detail",
    # Same permanent exemption as the layers contract: ARTIFACT_CHECKS reach
    # upward lazily, which otherwise chains listing -> config -> blueprint ->
    # connectors -> detail.
    "tracker.blueprint -> tracker.connectors",
]

# The two transports are siblings in the L6 row (":", so the layers contract
# alone would permit them to import each other), but they are alternative front
# doors onto the same services, not a stack: each must reach the tiers below on
# its own (docs/architecture.md). `routers/intelligence.py` names
# `tracker.mcp.server` only inside the argv of a subprocess, which is a string
# and not an import.
[[tool.importlinter.contracts]]
name = "API and MCP are independent transports"
type = "independence"
modules = [
    "tracker.api",
    "tracker.mcp",
]

# --------------------------------------------------------------------------- #
# Types: a narrow, honest set that grows with each extraction
# --------------------------------------------------------------------------- #
#
# `follow_imports = silent` is the setting that makes a narrow set narrow. mypy
# follows every import by default, so these modules would report errors from
# every file they import. Silent still READS the imported modules for
# types; it just does not report their errors.
#
# `files` is the typed set. It grows when code is
# extracted or written; it does not shrink, and `tests/test_typing_pilot.py`
# fails on a module removed from it. Nothing here may be made green with a
# blanket `ignore_errors` or by widening a return to `Any` — that is checked
# too, because muting is the one change that looks identical to fixing.
[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
# Completeness, for the set alone: silent imports keep every report to the
# files below. A half-annotated def is an error, an unannotated body is
# still checked, and an ignore that no longer silences anything must go.
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
# The plugin SDK and the robots matcher live outside backend/
# (docs/plugins.md); pytest.ini puts the same paths on sys.path. The matcher
# is its own distribution because the SDK's fake host must answer robots the
# way the live host does, and the API may not load the SDK.
mypy_path = "../sdk/python:../robots/python"
files = [
    "packaged.py",
    "scripts/install_pg_contrib.py",
    "scripts/package_pg_contrib.py",
    "scripts/windows_checkpoint.py",
    "scripts/windows_recovery.py",
