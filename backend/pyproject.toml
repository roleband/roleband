[[tool.mypy.overrides]]
# Third-party packages that ship no stubs. This silences the IMPORT, never one
# of our own modules: an error in a file under `files` above is always ours.
module = [
    "pgvector.*",
    "selectolax.*",
    "apple_fm_sdk.*",
    "asyncpg.*",
    "psycopg2.*",
    "psutil.*",
    "ijson.*",
    # Optional (requirements-optional.txt): typed when installed, absent otherwise.
    "playwright.*",
]
ignore_missing_imports = true
