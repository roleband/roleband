# Tool configuration only. Packaging stays requirements.txt + .venv (repo rule).

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length: not enforced; formatter-free repo
    "UP042",  # str,Enum -> StrEnum changes str(member); revisit deliberately
]

[tool.ruff.lint.isort]
known-first-party = ["tracker", "scripts", "tests"]

# Layer contract (docs/architecture.md, "Backend layers") encoded against the
# CURRENT layout. Rows run HIGHEST FIRST, the inverse of the doc's L0..L7 numbering,
# which counts up from the bottom. Each row is annotated with the layer it
# encodes: the Nth row is NOT LN, and reading it that way inverts the intent.
# Delimiters (import-linter 2.13, contracts/layers.py): ":" = siblings MAY
# import each other (grimp independent=False); "|" = siblings MUST NOT
# (independent=True). The layer model allows same-layer imports in L4 and forbids them in L3,
# so the L4 row below is ":" and the L3 row is "|". Both are deliberate — a
# probe importing across the ":" row is EXPECTED to pass, and is not evidence
# that the contract is unenforced.
# Violations of the target model live in ignore_imports as a ratcheted
# allowlist — shrink only, never grow.
[tool.importlinter]
root_packages = ["tracker"]

[[tool.importlinter.contracts]]
name = "Backend layers (strictly downward)"
type = "layers"
layers = [
    # L6 interface.
    "tracker.api : tracker.mcp",
    # L5 workflows.
    "tracker.workflows : tracker.daily : tracker.scheduler : tracker.watchdog : tracker.discover_roles : tracker.agents : tracker.supervisor",
    # L4 services. ":" is the layer rule ("same-layer imports allowed in L4"), not
    # an oversight: db/ is the shared store this whole tier is built on, so the
    # siblings below import each other widely.
    # Switching this row to "|" is a re-architecture, not a lint fix.
    "tracker.db : tracker.intelligence_runtime : tracker.enrich : tracker.skills : tracker.lineage : tracker.semantic : tracker.search : tracker.profiles : tracker.user_profile : tracker.notifications : tracker.analytics : tracker.settings_store : tracker.company_store : tracker.company_discovery : tracker.company_directory : tracker.health : tracker.content : tracker.ats_detect : tracker.board_resolve : tracker.board_relocate : tracker.osnotify : tracker.scope : tracker.pay_store : tracker.usage_stats : tracker.plugins",
    # `intelligence` composes the model backends (it owns the provider
    # Protocol, the registry, and the adapters that wrap the two LLM clients), so
    # it sits one layer ABOVE them. This is a tightening, not an exemption.
    "tracker.intelligence",
    # L3 implementations. "|" is the layer rule ("implementations never import each
    # other"); this is the row that independence applies to. L2 contracts
    # (connectors/base, comp_providers/base, the prices Protocol, the llm client
    # protocol) live INSIDE these packages, so L2 has no row of its own.
    "tracker.connectors | tracker.comp_providers | tracker.prices | tracker.cloud_llm | tracker.local_llm",
    # L1 vocabulary.
    "tracker.blueprint : tracker.config : tracker.company_catalog : tracker.pay_disclosure : tracker.pay_numbers : tracker.pay_period : tracker.provider_pacing : tracker.source_policy : tracker.source_review : tracker.taxonomy : tracker.levels : tracker.schema : tracker.plugin_manifest",
    # L0 primitives. `vendored` is a leaf data registry (upstream provenance
    # pins) that imports nothing; placed here so the contract keeps it that way.
    "tracker.vendored",
    # L0 platform.
    "tracker.platform",
]
# `exhaustive = true` is NOT available here: it requires `containers`, which
# rewrites every layer name into tail form (`api`, not `tracker.api`), and
# `test_no_compat_shims.py::test_no_import_contract_names_a_retired_module`
# matches retired names by their prefixed spelling — the flag would silently
# blind that gate. Membership is asserted instead by
# `tests/test_import_contracts.py`, which also freezes the allowlist below and
# proves each contract still fires.
exhaustive = false
ignore_imports = [
    # Permanent exemption (docs/architecture.md): ARTIFACT_CHECKS
    # deliberately reach upward; exercised at test time.
    "tracker.blueprint -> tracker.connectors",
    # Ratchet debt: shrink only, never add. Empty: a module that reaches the
    # store lives in a tier that may. `tests/test_import_contracts.py` keeps the
    # list at zero.
]

# Target-model key rule: interface/workflow/service layers reach listing
# adapters only via the ADAPTER_REGISTRY package seam, never concrete modules.
[[tool.importlinter.contracts]]
name = "Concrete adapters are private to the registry"
type = "forbidden"
# Direct imports only: everything reaches tracker.connectors.listing (the registry) legally
# via config -> blueprint; the chain to concrete modules lives inside L3.
allow_indirect_imports = true
source_modules = [
    # Every package above the adapters' row in the layers contract
    # (`tests/test_import_contract_registry.py` holds the two equal).
    "tracker.api",
    "tracker.mcp",
    "tracker.workflows",
    "tracker.daily",
    "tracker.scheduler",
    "tracker.watchdog",
    "tracker.discover_roles",
    "tracker.agents",
    "tracker.supervisor",
    "tracker.db",
    "tracker.intelligence_runtime",
    "tracker.enrich",
    "tracker.skills",
    "tracker.lineage",
    "tracker.semantic",
    "tracker.search",
    "tracker.profiles",
    "tracker.user_profile",
    "tracker.notifications",
    "tracker.analytics",
    "tracker.settings_store",
    "tracker.company_store",
    "tracker.company_discovery",
    "tracker.company_directory",
    "tracker.health",
    "tracker.content",
    "tracker.ats_detect",
    "tracker.board_resolve",
    "tracker.board_relocate",
    "tracker.osnotify",
    "tracker.scope",
    "tracker.pay_store",
    "tracker.usage_stats",
    "tracker.plugins",
    "tracker.intelligence",
]
forbidden_modules = [
    "tracker.connectors.listing.accenture",
    "tracker.connectors.listing.amazon",
    "tracker.connectors.listing.apple",
    "tracker.connectors.listing.ashby",
    "tracker.connectors.listing.atlassian",
    "tracker.connectors.listing.avature",
    "tracker.connectors.listing.deel",
    "tracker.connectors.listing.eightfold",
