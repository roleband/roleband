[pytest]
# The plugin SDK and the robots matcher are packages outside backend/
# (docs/plugins.md); the matcher is shared with the SDK's fake host.
pythonpath = ../sdk/python ../robots/python
asyncio_default_fixture_loop_scope = function
# Parallel by default. The scratch database is named per PROCESS
# (`tests/conftest.py`: roleband_test_{os.getpid()}), so workers cannot collide.
# It is the default rather than a flag to remember because it costs a
# single-file run next to nothing. `auto` is sized to the machine by
# `conftest.py` beside this file; `-n <count>` or PYTEST_XDIST_AUTO_NUM_WORKERS
# sets it by hand.
#
# `-n 0` runs in-process and is what you want with `--pdb` or when reading
# interleaved output; xdist reorders and swallows both.
addopts = -n auto
# A test that reads past backend/ runs on every pull request (tests/repo_wide.py).
markers =
    repo_wide: reads a path above backend/, so a pull request runs it whatever it changes
    reads_docs: reads documentation, so a pull request that changes only documentation runs it
